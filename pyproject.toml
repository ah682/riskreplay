[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "riskreplay"
version = "0.1.0"
description = "A local, evidence-aware temporal fraud policy replay lab"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyarrow==20.0.0",
  "numpy==2.4.6",
  "scipy==1.17.1",
  "scikit-learn==1.8.0",
  "joblib==1.5.3",
  "fastapi==0.135.1",
  "uvicorn==0.41.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.17.0"]

[project.scripts]
riskreplay = "riskreplay.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["riskreplay"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
