[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "riskreplay"
version = "0.1.1"
description = "Replay fraud decisions and evaluate models using the evidence available at the time."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyarrow==20.0.0",
  "numpy==2.4.6",
  "scipy==1.17.1",
  "scikit-learn==1.8.0",
  "joblib==1.5.3",
  "fastapi==0.135.1",
  "uvicorn==0.41.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.17.0"]

[project.urls]
Homepage = "https://ah682.github.io/riskreplay/"
Repository = "https://github.com/ah682/riskreplay"
Issues = "https://github.com/ah682/riskreplay/issues"
Changelog = "https://github.com/ah682/riskreplay/blob/main/CHANGELOG.md"

[project.scripts]
riskreplay = "riskreplay.cli:main"

[tool.hatch.build]
include = ["riskreplay/**", "README.md", "CONTRIBUTING.md", "CHANGELOG.md", "LICENSE*", "NOTICE*"]

[tool.hatch.build.targets.wheel]
packages = ["riskreplay"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.sdist]
include = ["riskreplay/", "scripts/", "tests/", "docs/", ".github/", "README.md", "CONTRIBUTING.md", "CHANGELOG.md", "LICENSE*", "NOTICE*", "Makefile", "pyproject.toml", "requirements.lock", ".env.example"]
